trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: go-url-alias

steps:
  - task: NodeTool@0
    displayName: "Install Node.js 20"
    inputs:
      versionSpec: "20.x"

  - script: npm ci
    displayName: "Install frontend dependencies"

  - script: npm ci
    displayName: "Install API dependencies"
    workingDirectory: api/

  - script: npm test
    displayName: "Run frontend tests"

  - script: npm test
    displayName: "Run API tests"
    workingDirectory: api/

  - script: npm run build
    displayName: "Build frontend (Vite → dist/)"

  - script: npm run build
    displayName: "Build API (TypeScript compile)"
    workingDirectory: api/

  - script: AUTH_MODE=corporate npx tsx scripts/generate-swa-config.ts
    displayName: "Generate SWA config (corporate mode)"

  # Debug step to troubleshoot too many files in dist
  - script: ls -R $(System.DefaultWorkingDirectory)/dist | wc -l
    displayName: "Count files in dist"

  # Debug step to troubleshoot too many files in dist
  - script: ls $(System.DefaultWorkingDirectory)/dist
    displayName: "List dist contents"

  # Copy static web app config to dist directory
  - script: cp staticwebapp.config.json dist/
    displayName: "Copy config to dist"

  - task: AzureStaticWebApp@0
    displayName: "Deploy to Azure Static Web App"
    inputs:
      app_location: "dist"
      api_location: "api"
      output_location: ""
      config_file_location: "/"
      skip_app_build: true
      skip_api_build: true
    env:
      # Map the secret directly to the environment variable the task looks for
      azure_static_web_apps_api_token: $(DEPLOYMENT_TOKEN)
